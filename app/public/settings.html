<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Buddy · 更换背景</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>更换背景</h1>
      <a href="index.html" style="font-size:13px;color:#2563eb;">← 返回发布面板</a>
    </div>

    <div class="card">
      <h2>大屏弹窗背景（教室大屏展示）</h2>
      <div class="form-row">
        <label>选择图片（jpg / png，≤5MB，建议横版 16:9，深色图更利于白字可读）</label>
        <input type="file" id="file-display" accept="image/jpeg,image/png" />
      </div>
      <div style="margin-bottom:12px;">
        <img id="prev-display" style="display:none;max-width:100%;max-height:180px;border-radius:8px;border:1px solid #e5e7eb;" alt="预览" />
      </div>
      <button class="btn" id="btn-display-save">保存大屏背景</button>
      <div id="msg-display" class="muted" style="margin-top:8px;"></div>
    </div>

    <div class="card">
      <h2>重置连接码（Token）</h2>
      <div class="form-row">
        <label>新连接码 Token（4 位以上字母数字；改后教室屏幕角落会同步显示新码）</label>
        <input type="text" id="token-new" placeholder="例如：K8M3" />
      </div>
      <button class="btn" id="btn-token-save">保存并重置</button>
      <div id="token-msg" class="muted" style="margin-top:8px;"></div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
